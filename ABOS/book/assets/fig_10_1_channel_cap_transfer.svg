<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220">

  <defs>
    <filter id="sh" x="-4%" y="-4%" width="112%" height="116%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="1.2" flood-color="#9aa3ad" flood-opacity="0.65"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #111827; stroke-width: 1.5; }
      .title { font-family: "Liberation Sans", Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #111827; }
      .lbl   { font-family: "Liberation Serif", Georgia, serif; font-size: 12px; fill: #111827; }
      .lbl-b { font-family: "Liberation Sans", Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #111827; }
      .mono  { font-family: "Liberation Mono", monospace; font-size: 10.5px; fill: #1f2937; }
      .sub   { font-family: "Liberation Serif", Georgia, serif; font-size: 10.5px; fill: #374151; }
      .box-green  { fill: #bbf7d0; stroke: #14532d; stroke-width: 1.4; filter: url(#sh); }
      .box-blue   { fill: #bfdbfe; stroke: #1e3a8a; stroke-width: 1.4; filter: url(#sh); }
      .box-amber  { fill: #fde68a; stroke: #78350f; stroke-width: 1.4; filter: url(#sh); }
      .box-pink   { fill: #fbcfe8; stroke: #831843; stroke-width: 1.4; filter: url(#sh); }
      .box-purple { fill: #e9d5ff; stroke: #4c1d95; stroke-width: 1.4; filter: url(#sh); }
      .box-cyan   { fill: #bae6fd; stroke: #0c4a6e; stroke-width: 1.4; filter: url(#sh); }
      .box-gray   { fill: #e5e7eb; stroke: #374151; stroke-width: 1.3; }
      .dash-group { fill: #f8fafc; stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5,4; }
      .line  { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
      .bline { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-start: url(#arr); marker-end: url(#arr); }
      .dline { stroke: #475569; stroke-width: 1.3; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect x="2" y="2" width="716" height="216" class="frame"/>

  <text x="360" y="25" text-anchor="middle" class="title">Capability Handle Transfer Across Processes via ChannelDispatcher</text>
  <rect x="24" y="48" width="195" height="145" rx="7" class="box-pink"/>
  <text x="121" y="70" text-anchor="middle" class="lbl-b">Sender Process (fs-srv)</text>
  <text x="36" y="94" class="mono">handles[slot 4]:</text>
  <text x="36" y="112" class="mono">  obj = calc.bin VMO</text>
  <text x="36" y="130" class="mono">  rights = R|W|X|MAP|XFER</text>
  <text x="36" y="154" class="sub">handle_take_for_transfer():</text>
  <text x="36" y="170" class="sub">Clears slot &amp; increments gen!</text>

  <rect x="262" y="48" width="196" height="90" rx="7" class="box-amber"/>
  <text x="360" y="70" text-anchor="middle" class="lbl-b">ab_message_packet_t (EL1)</text>
  <text x="276" y="92" class="mono">data[256] + num_bytes</text>
  <text x="276" y="110" class="mono">objs[0]   = VMO ptr</text>
  <text x="276" y="126" class="mono">rights[0] = R|W|X|MAP</text>

  <rect x="262" y="152" width="196" height="44" rx="7" class="box-purple"/>
  <text x="360" y="172" text-anchor="middle" class="mono">ab_vmo_dispatcher_t</text>
  <text x="360" y="188" text-anchor="middle" class="sub">koid=1099 (ref &amp; hc preserved)</text>

  <rect x="501" y="48" width="195" height="145" rx="7" class="box-green"/>
  <text x="598" y="70" text-anchor="middle" class="lbl-b">Receiver Process (shell)</text>
  <text x="513" y="94" class="mono">handles[slot 6]:</text>
  <text x="513" y="112" class="mono">  obj = calc.bin VMO</text>
  <text x="513" y="130" class="mono">  new_h = 0x50000106</text>
  <text x="513" y="154" class="sub">handle_install_transferred():</text>
  <text x="513" y="170" class="sub">Rollback-safe slot install!</text>

  <path d="M 219 95 L 260 95" class="line"/>
  <path d="M 458 95 L 499 95" class="line"/>
  <path d="M 360 138 L 360 150" class="line"/>

</svg>
