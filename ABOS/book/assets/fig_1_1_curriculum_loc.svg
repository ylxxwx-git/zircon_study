<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250">

  <defs>
    <filter id="sh" x="-4%" y="-4%" width="112%" height="116%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="1.2" flood-color="#9aa3ad" flood-opacity="0.65"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #111827; stroke-width: 1.5; }
      .title { font-family: "Liberation Sans", Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #111827; }
      .lbl   { font-family: "Liberation Serif", Georgia, serif; font-size: 12px; fill: #111827; }
      .lbl-b { font-family: "Liberation Sans", Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #111827; }
      .mono  { font-family: "Liberation Mono", monospace; font-size: 10.5px; fill: #1f2937; }
      .sub   { font-family: "Liberation Serif", Georgia, serif; font-size: 10.5px; fill: #374151; }
      .box-green  { fill: #bbf7d0; stroke: #14532d; stroke-width: 1.4; filter: url(#sh); }
      .box-blue   { fill: #bfdbfe; stroke: #1e3a8a; stroke-width: 1.4; filter: url(#sh); }
      .box-amber  { fill: #fde68a; stroke: #78350f; stroke-width: 1.4; filter: url(#sh); }
      .box-pink   { fill: #fbcfe8; stroke: #831843; stroke-width: 1.4; filter: url(#sh); }
      .box-purple { fill: #e9d5ff; stroke: #4c1d95; stroke-width: 1.4; filter: url(#sh); }
      .box-cyan   { fill: #bae6fd; stroke: #0c4a6e; stroke-width: 1.4; filter: url(#sh); }
      .box-gray   { fill: #e5e7eb; stroke: #374151; stroke-width: 1.3; }
      .dash-group { fill: #f8fafc; stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5,4; }
      .line  { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
      .bline { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-start: url(#arr); marker-end: url(#arr); }
      .dline { stroke: #475569; stroke-width: 1.3; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect x="2" y="2" width="716" height="246" class="frame"/>

  <text x="360" y="26" text-anchor="middle" class="title">ABOS 20-Lesson Progression &amp; Complete OS Scale (~9.5K LOC)</text>
  <rect x="28" y="48" width="205" height="125" rx="8" class="box-green"/>
  <text x="130" y="70" text-anchor="middle" class="lbl-b">Phase 1: LK Hardware Core</text>
  <text x="130" y="88" text-anchor="middle" class="mono">Lessons 01 – 06</text>
  <text x="42" y="110" class="sub">• EL2→EL1, PSCI 4-Core SMP</text>
  <text x="42" y="126" class="sub">• VBAR_EL1, GICv2, Timer</text>
  <text x="42" y="142" class="sub">• DTB, PMM, Heap, Higher-Half</text>
  <text x="42" y="158" class="sub">• Preemptive Threads &amp; WaitQueues</text>

  <rect x="258" y="48" width="205" height="125" rx="8" class="box-blue"/>
  <text x="360" y="70" text-anchor="middle" class="lbl-b">Phase 2: Zircon Capabilities</text>
  <text x="360" y="88" text-anchor="middle" class="mono">Lessons 07 – 11</text>
  <text x="272" y="110" class="sub">• Dispatcher Objects &amp; KOIDs</text>
  <text x="272" y="126" class="sub">• Gen-Tagged Handles &amp; Rights</text>
  <text x="272" y="142" class="sub">• StateTracker, EventPair, Port</text>
  <text x="272" y="158" class="sub">• Channels, VMO &amp; VMAR Paging</text>

  <rect x="488" y="48" width="205" height="125" rx="8" class="box-amber"/>
  <text x="590" y="70" text-anchor="middle" class="lbl-b">Phase 3: EL0 Microkernel OS</text>
  <text x="590" y="88" text-anchor="middle" class="mono">Lessons 12 – 20</text>
  <text x="502" y="110" class="sub">• Job / Process / Thread &amp; userboot</text>
  <text x="502" y="126" class="sub">• Resource, DMA VMO &amp; IRQ Caps</text>
  <text x="502" y="142" class="sub">• BOOTFS: console-srv, fs-srv</text>
  <text x="502" y="158" class="sub">• 4 VTs, ps/vmaps, shell &amp; calc</text>

  <path d="M 233 110 L 256 110" class="line"/>
  <path d="M 463 110 L 486 110" class="line"/>

  <rect x="28" y="192" width="160" height="36" class="box-purple"/>
  <text x="108" y="214" text-anchor="middle" class="lbl-b">ABOS Lesson 20: 9.5K LOC</text>
  <rect x="205" y="192" width="160" height="36" class="box-cyan"/>
  <text x="285" y="214" text-anchor="middle" class="lbl">Linux 0.12 (ECLK): ~19K LOC</text>
  <rect x="382" y="192" width="150" height="36" class="box-gray"/>
  <text x="457" y="214" text-anchor="middle" class="sub">Fuchsia Zircon: ~350K+ LOC</text>
  <rect x="548" y="192" width="145" height="36" class="box-gray"/>
  <text x="620" y="214" text-anchor="middle" class="sub">Modern Linux: &gt;30M LOC</text>

</svg>
