<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 245" width="720" height="245">

  <defs>
    <filter id="sh" x="-4%" y="-4%" width="112%" height="116%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="1.2" flood-color="#9aa3ad" flood-opacity="0.65"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #111827; stroke-width: 1.5; }
      .title { font-family: "Liberation Sans", Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #111827; }
      .lbl   { font-family: "Liberation Serif", Georgia, serif; font-size: 12px; fill: #111827; }
      .lbl-b { font-family: "Liberation Sans", Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #111827; }
      .mono  { font-family: "Liberation Mono", monospace; font-size: 10.5px; fill: #1f2937; }
      .sub   { font-family: "Liberation Serif", Georgia, serif; font-size: 10.5px; fill: #374151; }
      .box-green  { fill: #bbf7d0; stroke: #14532d; stroke-width: 1.4; filter: url(#sh); }
      .box-blue   { fill: #bfdbfe; stroke: #1e3a8a; stroke-width: 1.4; filter: url(#sh); }
      .box-amber  { fill: #fde68a; stroke: #78350f; stroke-width: 1.4; filter: url(#sh); }
      .box-pink   { fill: #fbcfe8; stroke: #831843; stroke-width: 1.4; filter: url(#sh); }
      .box-purple { fill: #e9d5ff; stroke: #4c1d95; stroke-width: 1.4; filter: url(#sh); }
      .box-cyan   { fill: #bae6fd; stroke: #0c4a6e; stroke-width: 1.4; filter: url(#sh); }
      .box-gray   { fill: #e5e7eb; stroke: #374151; stroke-width: 1.3; }
      .dash-group { fill: #f8fafc; stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5,4; }
      .line  { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
      .bline { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-start: url(#arr); marker-end: url(#arr); }
      .dline { stroke: #475569; stroke-width: 1.3; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect x="2" y="2" width="716" height="241" class="frame"/>

  <text x="360" y="26" text-anchor="middle" class="title">QEMU virt Physical Address Space &amp; 128 MB RAM Partitioning</text>
  <!-- MMIO Bar -->
  <text x="25" y="54" class="lbl-b">Low MMIO Space (0x0000_0000 – 0x3FFF_FFFF):</text>
  <rect x="25" y="64" width="140" height="40" class="box-gray"/>
  <text x="95" y="82" text-anchor="middle" class="mono">0x0800_0000</text>
  <text x="95" y="96" text-anchor="middle" class="sub">GICD / GICC (EL1)</text>
  <rect x="165" y="64" width="150" height="40" class="box-amber"/>
  <text x="240" y="82" text-anchor="middle" class="mono">0x0900_0000</text>
  <text x="240" y="96" text-anchor="middle" class="sub">PL011 UART0 (EL0)</text>
  <rect x="315" y="64" width="175" height="40" class="box-pink"/>
  <text x="402" y="82" text-anchor="middle" class="mono">0x0A00_0000</text>
  <text x="402" y="96" text-anchor="middle" class="sub">VirtIO-MMIO Bus (EL0)</text>
  <rect x="490" y="64" width="205" height="40" class="dash-group"/>
  <text x="592" y="88" text-anchor="middle" class="sub">Reserved Peripheral Window</text>

  <!-- RAM Bar -->
  <text x="25" y="134" class="lbl-b">System RAM Arena (0x4000_0000 – 0x4800_0000, 128 MB = 32,768 Pages):</text>
  <rect x="25" y="144" width="78" height="52" class="box-gray"/>
  <text x="64" y="166" text-anchor="middle" class="mono">Low 512K</text>
  <text x="64" y="182" text-anchor="middle" class="sub">Wired</text>

  <rect x="103" y="144" width="68" height="52" class="box-purple"/>
  <text x="137" y="166" text-anchor="middle" class="mono">.idmap</text>
  <text x="137" y="182" text-anchor="middle" class="sub">12 KB</text>

  <rect x="171" y="144" width="108" height="52" class="box-blue"/>
  <text x="225" y="166" text-anchor="middle" class="mono">Kernel Image</text>
  <text x="225" y="182" text-anchor="middle" class="sub">+ 32K Stacks</text>

  <rect x="279" y="144" width="256" height="52" class="box-green"/>
  <text x="407" y="166" text-anchor="middle" class="lbl-b">PMM Dynamic Frame Pool (~126 MB)</text>
  <text x="407" y="183" text-anchor="middle" class="sub">512K Heap | TTBR0 | 8K Thr Stacks | VMOs | 128K DMA</text>

  <rect x="535" y="144" width="80" height="52" class="box-cyan"/>
  <text x="575" y="166" text-anchor="middle" class="mono">-initrd</text>
  <text x="575" y="182" text-anchor="middle" class="sub">Reclaimed!</text>

  <rect x="615" y="144" width="80" height="52" class="box-amber"/>
  <text x="655" y="166" text-anchor="middle" class="mono">DTB Blob</text>
  <text x="655" y="182" text-anchor="middle" class="sub">Wired</text>

  <text x="25" y="216" class="mono">0x4000_0000</text>
  <text x="103" y="216" class="mono">0x4008_0000</text>
  <text x="279" y="216" class="mono">_end</text>
  <text x="618" y="216" class="mono">0x4800_0000</text>

</svg>
