<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270">

  <defs>
    <filter id="sh" x="-4%" y="-4%" width="112%" height="116%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="1.2" flood-color="#9aa3ad" flood-opacity="0.65"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #111827; stroke-width: 1.5; }
      .title { font-family: "Liberation Sans", Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #111827; }
      .lbl   { font-family: "Liberation Serif", Georgia, serif; font-size: 12px; fill: #111827; }
      .lbl-b { font-family: "Liberation Sans", Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #111827; }
      .mono  { font-family: "Liberation Mono", monospace; font-size: 10.5px; fill: #1f2937; }
      .sub   { font-family: "Liberation Serif", Georgia, serif; font-size: 10.5px; fill: #374151; }
      .box-green  { fill: #bbf7d0; stroke: #14532d; stroke-width: 1.4; filter: url(#sh); }
      .box-blue   { fill: #bfdbfe; stroke: #1e3a8a; stroke-width: 1.4; filter: url(#sh); }
      .box-amber  { fill: #fde68a; stroke: #78350f; stroke-width: 1.4; filter: url(#sh); }
      .box-pink   { fill: #fbcfe8; stroke: #831843; stroke-width: 1.4; filter: url(#sh); }
      .box-purple { fill: #e9d5ff; stroke: #4c1d95; stroke-width: 1.4; filter: url(#sh); }
      .box-cyan   { fill: #bae6fd; stroke: #0c4a6e; stroke-width: 1.4; filter: url(#sh); }
      .box-gray   { fill: #e5e7eb; stroke: #374151; stroke-width: 1.3; }
      .dash-group { fill: #f8fafc; stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5,4; }
      .line  { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
      .bline { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-start: url(#arr); marker-end: url(#arr); }
      .dline { stroke: #475569; stroke-width: 1.3; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect x="2" y="2" width="716" height="266" class="frame"/>

  <text x="360" y="25" text-anchor="middle" class="title">ARMv8-A Split Virtual Address Spaces (TCR_EL1: T0SZ=33, T1SZ=33, 4 KB Granule)</text>
  <!-- TTBR1 -->
  <rect x="22" y="42" width="325" height="208" class="dash-group"/>
  <text x="184" y="60" text-anchor="middle" class="lbl-b">Higher-Half Kernel Space (TTBR1_EL1, Global)</text>
  <rect x="40" y="76" width="125" height="44" rx="5" class="box-purple"/>
  <text x="102" y="96" text-anchor="middle" class="mono">kernel_table (L1)</text>
  <text x="102" y="111" text-anchor="middle" class="sub">1 GB Block PTEs</text>

  <rect x="195" y="72" width="138" height="48" rx="5" class="box-green"/>
  <text x="264" y="92" text-anchor="middle" class="mono">0xFFFF_FFFF_8000_0000</text>
  <text x="264" y="108" text-anchor="middle" class="sub">Physmap → PA 0x4000_0000</text>

  <rect x="195" y="136" width="138" height="48" rx="5" class="box-amber"/>
  <text x="264" y="156" text-anchor="middle" class="mono">0xFFFF_FFFF_C000_0000</text>
  <text x="264" y="172" text-anchor="middle" class="sub">Periphmap → PA 0x0000_0000</text>

  <path d="M 165 92 L 193 92" class="line"/>
  <path d="M 165 106 L 193 156" class="line"/>
  <text x="184" y="215" text-anchor="middle" class="sub">EL1-only (AP=00), PTE_NG=0</text>
  <text x="184" y="232" text-anchor="middle" class="sub">Never switched or flushed across syscalls!</text>

  <!-- TTBR0 -->
  <rect x="365" y="42" width="333" height="208" class="dash-group"/>
  <text x="531" y="60" text-anchor="middle" class="lbl-b">Per-Process User Space (TTBR0_EL1 + ASID 1..255)</text>
  <rect x="380" y="82" width="66" height="42" rx="5" class="box-blue"/>
  <text x="413" y="102" text-anchor="middle" class="mono">L1[0..1]</text>
  <text x="413" y="116" text-anchor="middle" class="sub">1GB/entry</text>

  <rect x="466" y="82" width="66" height="42" rx="5" class="box-blue"/>
  <text x="499" y="102" text-anchor="middle" class="mono">L2[0..511]</text>
  <text x="499" y="116" text-anchor="middle" class="sub">2MB/entry</text>

  <rect x="552" y="82" width="66" height="42" rx="5" class="box-blue"/>
  <text x="585" y="102" text-anchor="middle" class="mono">L3[0..511]</text>
  <text x="585" y="116" text-anchor="middle" class="sub">4KB PTE</text>

  <rect x="636" y="82" width="50" height="42" rx="5" class="box-pink"/>
  <text x="661" y="102" text-anchor="middle" class="mono">4KB</text>
  <text x="661" y="116" text-anchor="middle" class="sub">Frame</text>

  <path d="M 446 103 L 464 103" class="line"/>
  <path d="M 532 103 L 550 103" class="line"/>
  <path d="M 618 103 L 634 103" class="line"/>

  <rect x="380" y="145" width="306" height="88" rx="5" class="box-cyan"/>
  <text x="392" y="164" class="mono">• 0x0080_0000..0x0080_6000 : 24 KB User Stack (RW, UXN)</text>
  <text x="392" y="182" class="mono">• 0x1000_0000..0x1FFF_FFFF : Dynamic VMAR Mappings</text>
  <text x="392" y="200" class="mono">• 0x2000_0000+             : Standalone App (.bin, RWX)</text>
  <text x="392" y="218" class="mono">• PTE_NG=1 : Zero TLB flush on context switch!</text>

</svg>
