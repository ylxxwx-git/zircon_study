<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240">

  <defs>
    <filter id="sh" x="-4%" y="-4%" width="112%" height="116%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="1.2" flood-color="#9aa3ad" flood-opacity="0.65"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #111827; stroke-width: 1.5; }
      .title { font-family: "Liberation Sans", Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #111827; }
      .lbl   { font-family: "Liberation Serif", Georgia, serif; font-size: 12px; fill: #111827; }
      .lbl-b { font-family: "Liberation Sans", Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #111827; }
      .mono  { font-family: "Liberation Mono", monospace; font-size: 10.5px; fill: #1f2937; }
      .sub   { font-family: "Liberation Serif", Georgia, serif; font-size: 10.5px; fill: #374151; }
      .box-green  { fill: #bbf7d0; stroke: #14532d; stroke-width: 1.4; filter: url(#sh); }
      .box-blue   { fill: #bfdbfe; stroke: #1e3a8a; stroke-width: 1.4; filter: url(#sh); }
      .box-amber  { fill: #fde68a; stroke: #78350f; stroke-width: 1.4; filter: url(#sh); }
      .box-pink   { fill: #fbcfe8; stroke: #831843; stroke-width: 1.4; filter: url(#sh); }
      .box-purple { fill: #e9d5ff; stroke: #4c1d95; stroke-width: 1.4; filter: url(#sh); }
      .box-cyan   { fill: #bae6fd; stroke: #0c4a6e; stroke-width: 1.4; filter: url(#sh); }
      .box-gray   { fill: #e5e7eb; stroke: #374151; stroke-width: 1.3; }
      .dash-group { fill: #f8fafc; stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5,4; }
      .line  { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
      .bline { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-start: url(#arr); marker-end: url(#arr); }
      .dline { stroke: #475569; stroke-width: 1.3; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect x="2" y="2" width="716" height="236" class="frame"/>

  <text x="360" y="25" text-anchor="middle" class="title">AArch64 Exception Entry, 288-Byte iframe_t &amp; Dispatch Pipeline</text>
  <rect x="22" y="55" width="130" height="65" rx="6" class="box-amber"/>
  <text x="87" y="78" text-anchor="middle" class="lbl-b">EL0 / EL1 Trap</text>
  <text x="87" y="96" text-anchor="middle" class="mono">SVC #0 / Fault / IRQ</text>
  <text x="87" y="111" text-anchor="middle" class="sub">HW switches to SP_EL1</text>

  <rect x="180" y="55" width="145" height="65" rx="6" class="box-purple"/>
  <text x="252" y="78" text-anchor="middle" class="lbl-b">exceptions.S</text>
  <text x="252" y="96" text-anchor="middle" class="mono">regsave (sp -= 288)</text>
  <text x="252" y="111" text-anchor="middle" class="sub">Saves x0..x30, sp_el0, elr</text>

  <rect x="355" y="42" width="175" height="44" rx="6" class="box-blue"/>
  <text x="442" y="61" text-anchor="middle" class="lbl-b">EC=0x15: syscall_dispatch</text>
  <text x="442" y="77" text-anchor="middle" class="sub">34 Syscalls + copy_from/to_user</text>

  <rect x="355" y="96" width="175" height="44" rx="6" class="box-green"/>
  <text x="442" y="115" text-anchor="middle" class="lbl-b">EC=0x20/0x24: Demand Page</text>
  <text x="442" y="131" text-anchor="middle" class="sub">VMAR Fault or EL0 Fault Isolation</text>

  <rect x="355" y="150" width="175" height="44" rx="6" class="box-pink"/>
  <text x="442" y="169" text-anchor="middle" class="lbl-b">IRQ: GICC_IAR → Handler</text>
  <text x="442" y="185" text-anchor="middle" class="sub">Timer PPI 30 / EL0 SPI Mask+Sig</text>

  <rect x="560" y="88" width="138" height="65" rx="6" class="box-cyan"/>
  <text x="629" y="111" text-anchor="middle" class="lbl-b">regrestore + eret</text>
  <text x="629" y="129" text-anchor="middle" class="mono">sp += 288</text>
  <text x="629" y="144" text-anchor="middle" class="sub">Restores ELR &amp; SPSR</text>

  <path d="M 152 88 L 178 88" class="line"/>
  <path d="M 325 75 L 353 64" class="line"/>
  <path d="M 325 88 L 353 118" class="line"/>
  <path d="M 325 102 L 353 172" class="line"/>
  <path d="M 530 64 L 558 105" class="line"/>
  <path d="M 530 118 L 558 120" class="line"/>
  <path d="M 530 172 L 558 135" class="line"/>

</svg>
