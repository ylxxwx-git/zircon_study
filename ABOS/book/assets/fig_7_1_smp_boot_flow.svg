<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 275" width="720" height="275">

  <defs>
    <filter id="sh" x="-4%" y="-4%" width="112%" height="116%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="1.2" flood-color="#9aa3ad" flood-opacity="0.65"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #111827; stroke-width: 1.5; }
      .title { font-family: "Liberation Sans", Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #111827; }
      .lbl   { font-family: "Liberation Serif", Georgia, serif; font-size: 12px; fill: #111827; }
      .lbl-b { font-family: "Liberation Sans", Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #111827; }
      .mono  { font-family: "Liberation Mono", monospace; font-size: 9.4px; fill: #1f2937; }
      .sub   { font-family: "Liberation Serif", Georgia, serif; font-size: 10.2px; fill: #374151; }
      .box-green  { fill: #bbf7d0; stroke: #14532d; stroke-width: 1.4; filter: url(#sh); }
      .box-blue   { fill: #bfdbfe; stroke: #1e3a8a; stroke-width: 1.4; filter: url(#sh); }
      .box-amber  { fill: #fde68a; stroke: #78350f; stroke-width: 1.4; filter: url(#sh); }
      .box-pink   { fill: #fbcfe8; stroke: #831843; stroke-width: 1.4; filter: url(#sh); }
      .box-purple { fill: #e9d5ff; stroke: #4c1d95; stroke-width: 1.4; filter: url(#sh); }
      .box-cyan   { fill: #bae6fd; stroke: #0c4a6e; stroke-width: 1.4; filter: url(#sh); }
      .box-gray   { fill: #e5e7eb; stroke: #374151; stroke-width: 1.3; }
      .dash-group { fill: #f8fafc; stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5,4; }
      .line  { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
      .bline { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-start: url(#arr); marker-end: url(#arr); }
      .dline { stroke: #475569; stroke-width: 1.3; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect x="2" y="2" width="716" height="271" class="frame"/>

  <text x="360" y="24" text-anchor="middle" class="title">4-Core SMP Initialization &amp; EL0 System Server Bootstrap Flow</text>

  <rect x="20" y="38" width="205" height="220" class="dash-group"/>
  <text x="122" y="54" text-anchor="middle" class="lbl-b">EL1 Kernel (CPU 0 + CPUs 1..3)</text>
  <rect x="36" y="64" width="172" height="30" rx="5" class="box-green"/>
  <text x="122" y="83" text-anchor="middle" class="mono">start.S: MMU + I/D Caches</text>
  <rect x="36" y="104" width="172" height="30" rx="5" class="box-blue"/>
  <text x="122" y="123" text-anchor="middle" class="mono">DTB, PMM, Heap, GIC, Timer</text>
  <rect x="36" y="144" width="172" height="30" rx="5" class="box-purple"/>
  <text x="122" y="163" text-anchor="middle" class="mono">PSCI_CPU_ON (CPUs 1..3)</text>
  <rect x="36" y="184" width="172" height="30" rx="5" class="box-amber"/>
  <text x="122" y="203" text-anchor="middle" class="mono">BOOTFS VMO + Spawn userboot</text>
  <rect x="36" y="222" width="172" height="26" rx="4" class="box-gray"/>
  <text x="122" y="239" text-anchor="middle" class="sub">Wait ub_thr → Idle Loop (wfi)</text>
  <path d="M 122 94 L 122 102" class="line"/>
  <path d="M 122 134 L 122 142" class="line"/>
  <path d="M 122 174 L 122 182" class="line"/>
  <path d="M 122 214 L 122 220" class="line"/>

  <rect x="252" y="38" width="210" height="220" class="dash-group"/>
  <text x="357" y="54" text-anchor="middle" class="lbl-b">userboot (PID 1 in EL0)</text>
  <rect x="268" y="68" width="178" height="32" rx="5" class="box-cyan"/>
  <text x="357" y="88" text-anchor="middle" class="mono">Read 5 Caps from boot_ch</text>
  <rect x="268" y="112" width="178" height="32" rx="5" class="box-cyan"/>
  <text x="357" y="132" text-anchor="middle" class="mono">Map bootfs.tar RO @ 0x10000000</text>
  <rect x="268" y="156" width="178" height="36" rx="5" class="box-pink"/>
  <text x="357" y="173" text-anchor="middle" class="mono">Spawn console-srv, fs-srv,</text>
  <text x="357" y="186" text-anchor="middle" class="mono">&amp; abos-shell-0..3</text>
  <rect x="268" y="204" width="178" height="42" rx="5" class="box-amber"/>
  <text x="357" y="222" text-anchor="middle" class="mono">Unmap/Close bootfs VMO;</text>
  <text x="357" y="236" text-anchor="middle" class="mono">Wait TASK_TERMINATED</text>
  <path d="M 357 100 L 357 110" class="line"/>
  <path d="M 357 144 L 357 154" class="line"/>
  <path d="M 357 192 L 357 202" class="line"/>

  <rect x="490" y="38" width="210" height="220" class="dash-group"/>
  <text x="595" y="54" text-anchor="middle" class="lbl-b">EL0 Servers &amp; Shells</text>
  <rect x="506" y="70" width="178" height="42" rx="5" class="box-amber"/>
  <text x="595" y="88" text-anchor="middle" class="mono">console-srv (UART + Port)</text>
  <text x="595" y="102" text-anchor="middle" class="sub">Has Resource Cap (IRQ 33)</text>
  <rect x="506" y="124" width="178" height="42" rx="5" class="box-pink"/>
  <text x="595" y="142" text-anchor="middle" class="mono">fs-srv (VirtIO DMA + Port)</text>
  <text x="595" y="156" text-anchor="middle" class="sub">Has Resource Cap (128K DMA)</text>
  <rect x="506" y="178" width="178" height="66" rx="5" class="box-green"/>
  <text x="595" y="198" text-anchor="middle" class="mono">abos-shell-0..3 (4 VTs)</text>
  <text x="595" y="214" text-anchor="middle" class="sub">ZERO Hardware Caps!</text>
  <text x="595" y="230" text-anchor="middle" class="sub">Spawns calc.bin via VMO</text>

  <path d="M 208 199 L 266 84" class="dline"/>
  <path d="M 446 174 L 504 91" class="dline"/>
  <path d="M 446 174 L 504 145" class="dline"/>
  <path d="M 446 174 L 504 205" class="dline"/>

</svg>
